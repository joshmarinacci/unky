[[permission]]
identifier = "allow-open-link-in-new-tab"
description = "Allows a browser page to request a new tab for a validated HTTP or HTTPS link."
commands.allow = ["open_link_in_new_tab"]

[[permission]]
identifier = "allow-get-external-browsers"
description = "Allows browser pages to list installed browsers for an explicit open-in-browser action."
commands.allow = ["get_external_browsers"]

[[permission]]
identifier = "allow-open-in-external-browser"
description = "Allows a browser page to open its own current URL in a selected external browser."
commands.allow = ["open_in_external_browser"]

[[permission]]
identifier = "allow-open-link-in-new-window"
description = "Allows a browser page to open a validated HTTP or HTTPS link in a browser window with the source tab's private mode."
commands.allow = ["open_link_in_new_window"]

[[permission]]
identifier = "allow-open-link-in-tab-folder"
description = "Allows a browser page to open a validated HTTP or HTTPS link in a selected tab folder."
commands.allow = ["open_link_in_tab_folder"]

[[permission]]
identifier = "allow-get-tab-folders"
description = "Allows a browser page to read the tab folder names for its owning browser window."
commands.allow = ["get_tab_folders"]

[[permission]]
identifier = "allow-sync-page-url"
description = "Allows a browser page to report same-origin client-side URL changes."
commands.allow = ["sync_page_url"]

[[permission]]
identifier = "allow-focus-browser-tab"
description = "Allows a website child WebView to report that it received native focus."
commands.allow = ["focus_browser_tab"]

[[permission]]
identifier = "allow-desktop-test-inspect-page"
description = "Allows the debug-only WebDriver host to inspect a website child WebView."
commands.allow = ["desktop_test_inspect_page"]

[[permission]]
identifier = "allow-desktop-test-inspect-tab-drag-overlay"
description = "Allows the debug-only WebDriver host to inspect the native tab drag overlay."
commands.allow = ["desktop_test_inspect_tab_drag_overlay"]

[[permission]]
identifier = "allow-desktop-test-show-tab-drag-feedback"
description = "Allows the debug-only WebDriver host to capture native tab drag feedback."
commands.allow = ["desktop_test_show_tab_drag_feedback"]

[[permission]]
identifier = "allow-desktop-test-browser-ui"
description = "Allows the debug-only WebDriver host to inspect and exercise the trusted browser UI."
commands.allow = ["desktop_test_browser_ui"]

[[permission]]
identifier = "allow-desktop-test-new-window"
description = "Allows the debug-only WebDriver host to test website popup handling."
commands.allow = ["desktop_test_request_new_window"]

[[permission]]
identifier = "allow-main-browser-commands"
description = "Enables browser commands for the trusted local browser interface."
commands.allow = [
  "get_browser_state",
  "get_external_browsers",
  "open_in_external_browser",
  "clear_browsing_data",
  "get_filter_settings",
  "set_filtering_enabled",
  "set_filter_site_exception",
  "update_filter_list",
  "take_launch_request",
  "get_history",
  "get_downloads",
  "find_in_page",
  "get_tab_favicon",
  "get_page_security_info",
  "toggle_page_security_popover",
  "update_page_security_popover",
  "cycle_tab",
  "reveal_download",
  "control_downloads_popover",
  "open_link_in_new_tab",
  "open_link_in_new_window",
  "focus_browser_tab",
  "create_tab",
  "select_tab",
  "reorder_tabs",
  "close_tab",
  "navigate",
  "go_back",
  "go_forward",
  "reload",
  "stop_loading",
  "set_settings_open",
  "set_page_context_menu_enabled",
  "set_view_bounds",
  "reopen_closed_tab",
  "set_tab_dragging",
  "toggle_devtools",
  "get_split_tabs",
  "split_tab",
  "clear_tab_split",
  "resize_tab_split",
  "move_tab_to_new_window",
  "session_test_phase",
  "report_session_test",
  "session_test_open_new_tab",
  "session_test_start_download"
]
