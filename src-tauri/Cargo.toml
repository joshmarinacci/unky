[package]
name = "my-browser"
version = "0.1.0"
description = "A cross-platform desktop browser prototype"
authors = ["you"]
edition = "2021"

[lib]
name = "my_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
macos-interception-test = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
tauri = { version = "=2.12.5", features = ["unstable"] }
url = "=2.5.8"
blocker-core = { path = "../crates/blocker-core" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSString", "NSError"] }
objc2-web-kit = { version = "=0.3.2", features = ["WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKWebView", "block2"] }
