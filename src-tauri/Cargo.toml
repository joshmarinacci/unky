[package]
name = "my-browser"
version = "0.1.2"
description = "A cross-platform desktop browser prototype"
authors = ["you"]
edition = "2021"

[lib]
name = "my_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
macos-interception-test = []
macos-session-test = []
desktop-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["unstable", "devtools"] }
url = "=2.5.8"
blocker-core = { path = "../crates/blocker-core" }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-dialog = "=2.4.2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", features = ["NSPopover", "NSView", "NSViewController", "NSTextField", "NSResponder", "NSControl", "NSCell", "NSDragging", "NSPasteboard", "NSWindow", "NSColor", "NSBezierPath", "NSEvent"] }
objc2-foundation = { version = "=0.3.2", features = ["NSString", "NSError", "NSGeometry", "NSTimer", "NSDate", "block2"] }
objc2-web-kit = { version = "=0.3.2", features = ["WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKWebView", "block2"] }
