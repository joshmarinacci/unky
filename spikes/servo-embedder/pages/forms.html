<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forms & validation · Servo Lab</title><style>
:root{font:16px/1.5 system-ui,sans-serif;color:#182239;background:#f2f5fa}*{box-sizing:border-box}body{margin:0;padding:2rem 1rem}.shell{max-width:760px;margin:auto}.back{color:#5145b5}header{margin:2rem 0}h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;letter-spacing:-.05em}.form{background:white;border:1px solid #dce2ed;border-radius:20px;padding:clamp(1rem,4vw,2rem);box-shadow:0 14px 40px #26365813}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.field{display:flex;flex-direction:column;gap:.35rem}.wide{grid-column:1/-1}label{font-weight:650}input,select,textarea{font:inherit;padding:.7rem .8rem;border:1px solid #aab4c7;border-radius:9px;background:#fff;color:#172033}input:focus,select:focus,textarea:focus{outline:3px solid #7064df55;border-color:#6558dc}textarea{min-height:100px;resize:vertical}.hint{font-size:.82rem;color:#657087}.checks{display:flex;gap:1rem;flex-wrap:wrap}.checks label{font-weight:400}button{font:inherit;font-weight:700;background:#5e52ce;color:white;border:0;border-radius:10px;padding:.75rem 1.2rem;cursor:pointer}button:hover{background:#493dad}.result{padding:.8rem;border-radius:10px;background:#f0efff;min-height:3rem}@media(max-width:560px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="shell"><a class="back" href="index.html">← Lab index</a><header><p style="color:#6558dc;font-weight:800;text-transform:uppercase;letter-spacing:.12em">02 · Controls</p><h1>Forms that feel native</h1><p>Check control painting, focus handling, validation bubbles, and how the layout reflows on smaller windows.</p></header><form class="form" id="signup"><div class="grid"><div class="field"><label for="name">Display name</label><input id="name" name="name" required minlength="2" placeholder="Ada Lovelace"><span class="hint">Required · at least 2 characters</span></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required placeholder="ada@example.test"></div><div class="field"><label for="role">Primary use</label><select id="role" name="role"><option>Reading</option><option>Research</option><option>Development</option><option>Accessibility</option></select></div><div class="field"><label for="color">Accent color</label><input id="color" name="color" type="color" value="#6558dc" style="height:46px;padding:.2rem"></div><div class="field wide"><label for="notes">What should the browser do well?</label><textarea id="notes" name="notes" maxlength="240" placeholder="Type here, then submit the form…"></textarea></div><fieldset class="field wide" style="border:0;padding:0"><legend style="font-weight:650">Topics to explore</legend><div class="checks"><label><input type="checkbox" name="topics" value="privacy"> Privacy</label><label><input type="checkbox" name="topics" value="performance"> Performance</label><label><input type="checkbox" name="topics" value="accessibility"> Accessibility</label></div></fieldset><div class="field wide"><label for="range">Comfort with experiments: <output id="range-value">5</output>/10</label><input id="range" type="range" min="0" max="10" value="5"></div><div class="field wide"><button type="submit">Validate and preview</button></div></div><p id="result" class="result" aria-live="polite">Submit a valid form to see a summary.</p></form></main><script>
const form=document.querySelector('#signup'), result=document.querySelector('#result'), range=document.querySelector('#range');range.addEventListener('input',()=>document.querySelector('#range-value').value=range.value);form.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(form);result.textContent=`Hello, ${data.get('name')}! Role: ${data.get('role')}. Topics: ${data.getAll('topics').join(', ')||'none selected'}.`;result.dataset.submitted='true';});
</script></body></html>
