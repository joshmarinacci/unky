[package]
name = "servo-embedder-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
embedder_traits = { package = "servo-embedder-traits", version = "=0.7.0" }
euclid = "=0.22.14"
keyboard-types = { version = "=0.8.3", features = ["serde"] }
rustls = { version = "=0.23.35", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
