name: Build desktop bundles
run-name: >-
  Build desktop bundles — ${{ github.event_name == 'workflow_dispatch' && inputs.release_version && format('v{0} release candidate', inputs.release_version) || 'CI / no release version' }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer release version (leave empty for ordinary CI)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-bundles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-summary:
    name: Record build versions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add build details to run summary
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./package.json').version")
          {
            echo "## Build details"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Application version | `$APP_VERSION` |"
            if [[ -n "$RELEASE_VERSION" ]]; then
              echo "| Release candidate version | `$RELEASE_VERSION` |"
              echo "| Candidate artifact | `release-candidate-$RELEASE_VERSION` |"
            else
              echo "| Release candidate | None |"
            fi
            echo "| Event | `$GITHUB_EVENT_NAME` |"
            echo "| Source commit | `$GITHUB_SHA` |"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-dmg:
    name: macOS ARM64 DMG
    runs-on: macos-latest
    environment:
      name: macos-signing
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    if: github.event_name != 'workflow_dispatch' || inputs.release_version != ''
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Require macOS signing credentials for release candidates
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID" && test -n "$KEYCHAIN_PASSWORD"

      - name: Import Apple Developer ID certificate
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n ' | openssl base64 -d -A -out "$CERT_PATH"
          test -s "$CERT_PATH"
          if ! openssl pkcs12 -legacy -in "$CERT_PATH" -passin env:APPLE_CERTIFICATE_PASSWORD -noout -info; then
            echo "::error::APPLE_CERTIFICATE could not be opened as PKCS#12 with APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi
          echo "PKCS#12 certificate and private key validated."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "Certificate imported into the temporary keychain."
          IDENTITY_OUTPUT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          printf '%s\n' "$IDENTITY_OUTPUT"
          IDENTITY=$(printf '%s\n' "$IDENTITY_OUTPUT" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No Developer ID Application signing identity was found in the temporary keychain."
            exit 1
          fi
          echo "Found signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Generate build metadata
        run: npm run build:metadata

      - name: Build DMG
        if: github.event_name != 'workflow_dispatch' || inputs.release_version == ''
        run: npm run tauri-release

      - name: Build signed and notarized release DMG
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri-release

      - name: Verify signed and notarized DMG
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      - name: Remove temporary signing keychain
        if: always() && github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"

      - name: Rename DMG with build metadata
        run: |
          dmg=$(find target/release/bundle/dmg -name '*.dmg' -print -quit)
          version="${{ inputs.release_version || '' }}"
          if [[ -z "$version" ]]; then version="$BUILD_VERSION"; fi
          mv "$dmg" "target/release/bundle/dmg/Unky_${version}_build-${BUILD_NUMBER}_${BUILD_TIMESTAMP//:/}_${BUILD_COMMIT}_aarch64.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: my-browser-macos-arm64
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows ${{ matrix.arch }} NSIS installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
          - arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build NSIS installer
        run: npm run tauri -- build --target ${{ matrix.rust_target }} --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: my-browser-windows-${{ matrix.arch }}
          path: target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    name: Assemble release candidate
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: [macos-dmg, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download candidate installers
        uses: actions/download-artifact@v4
        with:
          pattern: my-browser-*
          path: release-artifacts
          merge-multiple: true

      - name: Fetch published release dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq '[.[][] | {tag_name, published_at}]' > "$RUNNER_TEMP/release-dates.json"

      - name: Prepare release preview and checksums
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_DATES_FILE: ${{ runner.temp }}/release-dates.json
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          npm run release:prepare

      - name: Include installers in review bundle
        run: cp release-artifacts/* release-output/

      - name: Upload complete review bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.release_version }}
          path: release-output/
          if-no-files-found: error
          retention-days: 14
