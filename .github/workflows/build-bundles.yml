name: Build desktop bundles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-bundles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-dmg:
    name: macOS ARM64 DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate build metadata
        run: npm run build:metadata

      - name: Build DMG
        run: npm run tauri-release

      - name: Rename DMG with build metadata
        run: |
          dmg=$(find target/release/bundle/dmg -name '*.dmg' -print -quit)
          mv "$dmg" "target/release/bundle/dmg/Unky_${BUILD_VERSION}_build-${BUILD_NUMBER}_${BUILD_TIMESTAMP//:/}_${BUILD_COMMIT}_aarch64.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: my-browser-macos-arm64
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows-arm64-installer:
    name: Windows ARM64 NSIS installer
    runs-on: windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build NSIS installer
        run: npm run build:installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: my-browser-windows-arm64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
