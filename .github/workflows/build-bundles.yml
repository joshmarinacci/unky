name: Build desktop bundles

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer release version (leave empty for ordinary CI)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-bundles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-dmg:
    name: macOS ARM64 DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate build metadata
        run: npm run build:metadata

      - name: Build DMG
        run: npm run tauri-release

      - name: Rename DMG with build metadata
        run: |
          dmg=$(find target/release/bundle/dmg -name '*.dmg' -print -quit)
          mv "$dmg" "target/release/bundle/dmg/Unky_${BUILD_VERSION}_build-${BUILD_NUMBER}_${BUILD_TIMESTAMP//:/}_${BUILD_COMMIT}_aarch64.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: my-browser-macos-arm64
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows ${{ matrix.arch }} NSIS installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
          - arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build NSIS installer
        run: npm run tauri -- build --target ${{ matrix.rust_target }} --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: my-browser-windows-${{ matrix.arch }}
          path: target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    name: Assemble release candidate
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: [macos-dmg, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download candidate installers
        uses: actions/download-artifact@v4
        with:
          pattern: my-browser-*
          path: release-artifacts
          merge-multiple: true

      - name: Prepare release preview and checksums
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          npm run release:prepare

      - name: Include installers in review bundle
        run: cp release-artifacts/* release-output/

      - name: Upload complete review bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.release_version }}
          path: release-output/
          if-no-files-found: error
          retention-days: 14
