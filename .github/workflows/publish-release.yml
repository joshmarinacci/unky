name: Publish approved release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string
      publish:
        description: Create the GitHub Release and update the public site (leave false for SSH dry run)
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve-candidate:
    name: Find release candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      run_url: ${{ steps.resolve.outputs.run_url }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Find the latest matching candidate on the default branch
        id: resolve
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a semantic version such as 1.2.3."
            exit 1
          fi

          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

          ARTIFACT_NAME="release-candidate-$RELEASE_VERSION"
          ARTIFACT_PAGES=$(gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f "name=$ARTIFACT_NAME" \
            -F per_page=100)
          CANDIDATE_RUN_IDS=$(jq -r --arg branch "$DEFAULT_BRANCH" '
            [.[].artifacts[]?
              | select(.expired == false)
              | select(.workflow_run.head_branch == $branch)
              | select(.workflow_run.id != null)]
            | sort_by(.created_at)
            | reverse
            | .[].workflow_run.id
          ' <<< "$ARTIFACT_PAGES")

          CANDIDATE_RUN_ID=""
          RUN=""
          while IFS= read -r RUN_ID; do
            [[ -n "$RUN_ID" ]] || continue
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
            if jq -e --arg branch "$DEFAULT_BRANCH" '
              .head_branch == $branch
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and (.path | split("@")[0] == ".github/workflows/build-bundles.yml")
            ' <<< "$RUN" >/dev/null; then
              CANDIDATE_RUN_ID="$RUN_ID"
              break
            fi
          done <<< "$CANDIDATE_RUN_IDS"

          if [[ -z "$CANDIDATE_RUN_ID" ]]; then
            echo "::error::No unexpired release-candidate-$RELEASE_VERSION artifact from a successful Build desktop bundles run was found on $DEFAULT_BRANCH."
            exit 1
          fi

          CANDIDATE_RUN_URL=$(jq -r '.html_url' <<< "$RUN")
          echo "run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=$CANDIDATE_RUN_URL" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(jq -r '.head_sha' <<< "$RUN")" >> "$GITHUB_OUTPUT"
          {
            echo "### Release candidate selected"
            echo
            echo "Version: $RELEASE_VERSION"
            echo
            echo "Source run: [$CANDIDATE_RUN_ID]($CANDIDATE_RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish approved release
    needs: resolve-candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    environment:
      name: production
      url: ${{ needs.resolve-candidate.outputs.run_url }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.source_sha }}

      - name: Download reviewed candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.version }}
          run-id: ${{ needs.resolve-candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-candidate

      - name: Validate candidate and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_COMMIT: ${{ needs.resolve-candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -f release-candidate/release.json
          test -f release-candidate/RELEASE_NOTES.md
          test -f release-candidate/SHA256SUMS.txt
          node -e 'const r=require("./release-candidate/release.json"); if(r.version!==process.env.RELEASE_VERSION || r.commit!==process.env.CANDIDATE_COMMIT) process.exit(1)'
          cd release-candidate
          sha256sum --check SHA256SUMS.txt
          shopt -s nullglob
          installers=(*.dmg *.exe)
          test "${#installers[@]}" -eq 3

      - name: Fetch published release dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq '[.[][] | {tag_name, published_at}]' > "$RUNNER_TEMP/release-dates.json"

      - name: Regenerate candidate download page
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ARTIFACT_DIR: release-candidate
          RELEASE_DATES_FILE: ${{ runner.temp }}/release-dates.json
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs
          cp release-output/index.html release-candidate/index.html

      - name: Configure restricted site SSH access
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.SITE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.SITE_DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.SITE_DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.SITE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PATH" && test -n "$DEPLOY_KNOWN_HOSTS"
          if grep -q 'ENCRYPTED' <<< "$DEPLOY_KEY"; then
            echo 'SITE_DEPLOY_KEY must not be passphrase protected.' >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/release_deploy
          chmod 600 ~/.ssh/release_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/release_deploy >/dev/null
          printf 'DEPLOY_HOST=%s\nDEPLOY_USER=%s\nDEPLOY_PATH=%s\n' "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PATH" >> "$GITHUB_ENV"

      - name: Verify restricted deployment access
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/release_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH' && printf 'SSH access verified for configured deployment directory\\n'"

      - name: Stop after SSH dry run
        if: ${{ !inputs.publish }}
        run: echo "SSH dry run passed; no release or site files were changed."

      - name: Create GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release v${RELEASE_VERSION} already exists; preserving its assets."
          else
            gh release create "v${RELEASE_VERSION}" release-candidate/*.dmg release-candidate/*.exe release-candidate/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Unky ${RELEASE_VERSION}" \
              --notes-file release-candidate/RELEASE_NOTES.md
          fi

      - name: Refresh release history with published dates
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          ARTIFACT_DIR: release-candidate
          RELEASE_DATES_FILE: ${{ runner.temp }}/release-dates.json
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq '[.[][] | {tag_name, published_at}]' > "$RELEASE_DATES_FILE"
          node scripts/prepare-release.mjs
          cp release-output/index.html release-candidate/index.html

      - name: Deploy page and immutable installers
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/release_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -av --ignore-existing -e 'ssh -i ~/.ssh/release_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' release-candidate/*.dmg release-candidate/*.exe release-candidate/SHA256SUMS.txt "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          rsync -av -e 'ssh -i ~/.ssh/release_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' release-candidate/index.html "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/index.html.new"
          ssh -i ~/.ssh/release_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mv '$DEPLOY_PATH/index.html.new' '$DEPLOY_PATH/index.html'"
